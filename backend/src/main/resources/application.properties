server.port=8080

# Conexion a Oracle. Las credenciales se proporcionan solo mediante el entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Spring nunca debe incorporar detalles internos en respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Configuracion operativa. El origen por defecto es solo para desarrollo local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.timezone=${APP_TIMEZONE:America/Guatemala}

# Todos los dias a la 1:00 se revisan certificaciones y tarjetas vencidas.
app.tareas.vencimientos=0 0 1 * * *
