server.port=8080

# Conexion a Oracle. Las credenciales se proporcionan solo mediante el entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Spring nunca debe incorporar detalles internos en respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Configuracion operativa. El origen por defecto es solo para desarrollo local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.timezone=${APP_TIMEZONE:America/Guatemala}

# JWT de acceso. No hay valores secretos predeterminados.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.audience=${JWT_AUDIENCE}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.jwt.clock-skew=PT30S

# Proteccion de inicio de sesion para la instancia academica unica.
app.auth.bcrypt-cost=12
app.auth.username-max-attempts=5
app.auth.client-max-attempts=20
app.auth.login-window=PT15M
app.auth.lock-duration=PT15M
app.auth.limiter-max-entries=10000

# El bootstrap se habilita una sola vez y siempre requiere valores explicitos.
app.auth.bootstrap.enabled=${APP_AUTH_BOOTSTRAP_ENABLED:false}
app.auth.bootstrap.username=${APP_AUTH_BOOTSTRAP_USERNAME:}
app.auth.bootstrap.password=${APP_AUTH_BOOTSTRAP_PASSWORD:}
app.auth.bootstrap.display-name=${APP_AUTH_BOOTSTRAP_DISPLAY_NAME:}

# Todos los dias a la 1:00 se revisan certificaciones y tarjetas vencidas.
app.tareas.vencimientos=0 0 1 * * *
